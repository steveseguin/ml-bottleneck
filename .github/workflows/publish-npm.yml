name: Publish SDK to npm

# Publishes dist/ (the ML Bottleneck engine SDK) to npm when the version in
# package.json changes on main, or on manual dispatch.
#
# Authentication, in order of preference:
#   1. npm trusted publishing (OIDC, no secret at all): on npmjs.com open the
#      package -> Settings -> Trusted Publisher -> GitHub Actions and enter
#      user "steveseguin", repository "ml-bottleneck", workflow "publish-npm.yml"
#      (environment blank). npm then mints a short-lived token for this
#      workflow run and attaches provenance automatically. Recommended: it
#      survives npm's 2FA-on-publish rules and needs no token rotation.
#   2. an NPM_TOKEN repository secret holding a granular access token that is
#      allowed to publish the package without 2FA. npm rejects 2FA-gated
#      tokens with EOTP; if that happens, switch to trusted publishing or run
#      `npm publish --otp=<code>` from dist/ locally.
# The package must already exist on npm (0.4.0 was published by hand once) and
# the repo needs a LICENSE file plus a "license" field in package.json.
on:
  push:
    branches: [main]
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI with trusted-publishing support (11.5.1+)
        run: npm install -g npm@latest && npm --version
      - name: Build and verify the SDK
        run: npm test
      - name: Check the package is publishable
        id: check
        run: |
          NAME=$(node -p "require('./dist/package.json').name")
          VERSION=$(node -p "require('./dist/package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$(node -p "require('./package.json').license || ''")" ] || [ ! -f dist/LICENSE ]; then
            echo "::error::Add a LICENSE file to the repo root and a \"license\" field to package.json before publishing to npm."
            exit 1
          fi
          if [ -z "${NPM_TOKEN}" ]; then
            echo "No NPM_TOKEN secret: publishing through npm trusted publishing (OIDC)."
          else
            echo "NPM_TOKEN secret present: trusted publishing is tried first, the token is the fallback."
          fi
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm; bump package.json to publish again."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish
        if: steps.check.outputs.already == 'false'
        working-directory: dist
        # With a trusted publisher configured, npm exchanges this job's OIDC
        # token for publish credentials and ignores NODE_AUTH_TOKEN; without
        # one it falls back to the secret (setup-node's placeholder keeps the
        # generated .npmrc valid when no secret is set).
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || 'XXXXX-XXXXX-XXXXX-XXXXX' }}
      - name: Confirm
        if: steps.check.outputs.already == 'false'
        run: |
          sleep 20
          npm view "${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}" version dist.tarball
